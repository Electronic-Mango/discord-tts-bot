[project]
name = "discord-tts-bot"
version = "1.0.0"
description = "Simple Discord bot reading text messages in a voice channel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "disnake[voice]>=2.12.0",
    "gtts>=2.5.4",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
